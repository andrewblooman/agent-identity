[project]
name = "agent-identity"
version = "0.1.0"
description = "Find AI agents in AWS and assess what they can reach"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.43",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "moto[all]>=5.0", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/agent_identity/demo/*" = ["S105", "S106"]
